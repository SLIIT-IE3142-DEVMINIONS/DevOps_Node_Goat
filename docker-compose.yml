version: "3.7"

services:

  web:
    build: .
    environment:
      NODE_ENV:
      MONGODB_URI: mongodb://mongo:27017/nodegoat

    command: sh -c "until nc -z -w 2 mongo 27017 && echo 'mongo is ready for connections'; do sleep 2; done; npm start"

    ports:
      - "4000:4000"

    depends_on:
      - mongo

  mongo:
    image: mongo:4.4
    user: mongodb
    expose:
      - 27017

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: