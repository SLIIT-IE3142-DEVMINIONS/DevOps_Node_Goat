name: pipeline_autoomation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests (if any)
        run: npm test --if-present

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
        continue-on-error: true   # WARN only — see note below


      - name: Run NodeGoat custom NoSQL rule
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/nodegoat-nosql.yml
        continue-on-error: true

  dependency-scan:
    name: Dependency Scan - npm audit
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run npm audit (fails on high/critical)
        run: npm audit --audit-level=high   # this is the HARD FAIL gate

  secrets-scan:
    name: Secrets Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nodegoat:${{ github.sha }} .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nodegoat:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'          # this is also a HARD FAIL gate
          ignore-unfixed: true
